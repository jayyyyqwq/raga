name: jugalbandi
version: "1.0.0"
description: >
  An RL environment that trains LLMs to maintain strict adherence to a
  Domain-Specific Language (Indian raga grammar) while the rules drift
  mid-episode under human-in-the-loop control. Capability trained:
  schema adherence under constraint drift.

theme: "Theme 5 - Wild Card"
authors:
  - name: "Jay & Team"

environment:
  class: JugalbandiEnv
  module: raaga_env.jugalbandi_env
  entry_point: "openenv_server.server:app"

observation_space:
  type: Box
  shape: [22]
  low: 0.0
  high: 1.0
  description: >
    22-dim continuous vector. Dims 0-7: last 4 notes played (note, duration).
    Dims 8-15: human call phrase (last 4 notes). Dim 16: melodic direction.
    Dim 17: tala position. Dim 18: tension metric. Dim 19: raga dial value.
    Dim 20: pakad drought. Dim 21: steps since last schema switch.

action_space:
  type: Discrete
  n: 48
  description: "note (12 semitones) x duration (4 values) = 48 discrete actions"

reward:
  min: -2.0
  max: 3.0
  description: >
    Five layers: hard-rule (−2.0 on forbidden note, early return),
    soft-rule (vadi +0.4, samvadi +0.3, smoothness, repetition penalty),
    sequence-level (pakad +1.0, sam landing +0.8),
    jugalbandi (call-resolve +0.5, direction contrast +0.3),
    drift-specific (grace 80% penalty reduction, adaptation bonus +3.0).

episode:
  max_steps: 64
  human_turn_every: 8  # human injects a 4-note call phrase every 8 steps

rubric:
  - id: valid_raga_adherence
    weight: 0.35
    description: "Fraction of steps with no forbidden-note violation"
  - id: pakad_rate
    weight: 0.25
    description: "Pakad completions per episode"
  - id: drift_adaptation_speed
    weight: 0.25
    description: "Steps to first new-raga pakad after a drift event"
  - id: jugalbandi_coherence
    weight: 0.15
    description: "Average jugalbandi reward per call-response pair"

tags:
  - music
  - schema-adherence
  - drift
  - human-in-the-loop
  - indian-classical
