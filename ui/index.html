<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jugalbandi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Jugal<span class="accent-text">bandi</span></h1>
    <div id="raga-label" class="raga-label">Raag Yaman · evening</div>
    <div class="dial-group">
      <label for="raga-dial">Raga dial</label>
      <input type="range" id="raga-dial" min="0" max="1" step="0.01" value="0" />
      <span id="dial-value">0.00</span>
    </div>
  </header>

  <main class="stage-wrap">
    <div id="stage-host" class="stage-host"></div>

    <div class="escalation-row">
      <span class="escalation-caption-label">Escalation</span>
      <div id="escalation" class="escalation"></div>
    </div>

    <div id="input-strip" class="input-strip disabled"></div>
    <p class="input-hint">Keys: S R G M P D N (madhya) · Shift+key (taar saptak) · Z X C V B N M (mandra)</p>

    <div class="controls-row">
      <button id="start-btn" class="btn btn-primary" disabled>Loading…</button>
      <button id="reset-btn" class="btn" disabled>Reset</button>
      <span id="phase-label" class="phase-label">—</span>
    </div>

    <p id="caption" class="caption"></p>
    <div id="chips" class="chips"></div>

    <div class="reward-row">
      <span class="reward-label">Total reward</span>
      <span id="reward-display" class="reward-display">0.00</span>
    </div>

    <details class="log-panel">
      <summary>Log</summary>
      <div id="log"></div>
    </details>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
